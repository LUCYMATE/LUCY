<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syra</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
      body {
        margin: 0;
        background-color: transparent;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      .mesh-bg-initial {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: -1;
        background: 
          radial-gradient(circle at 20% 30%, #4c1d95 0%, transparent 40%), 
          radial-gradient(circle at 80% 70%, #db2777 0%, transparent 40%), 
          radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
        opacity: 0.6;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #db2777;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 24px;
      }
      .loader-text {
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mesh-bg-initial"></div>
      <div id="initial-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Initializing System...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

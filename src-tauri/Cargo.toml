[package]
name = "soltini"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "soltini"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soltini"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
sysinfo = "0.30"
enigo = "0.1.3"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-global-shortcut = "2"
cpal = "0.17.1"
base64 = "0.22.1"
lazy_static = "1.5.0"
screenshots = "0.8.10"
image = "0.25.6"

tauri-plugin-http = "2"
tauri-plugin-fs = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Memory"] }

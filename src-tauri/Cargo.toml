[package]
name = "lucy"
version = "2.0.0"
description = "LUCY AI Desktop Companion"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lucy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
sysinfo = "0.30"
enigo = "0.1.3"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.17.1"
oww-rs = "0.3.3"
tract-core = "0.23"
tract-onnx = "0.23"
base64 = "0.22.1"
screenshots = "0.8.10"

tauri-plugin-http = "=2.6.1"
tauri-plugin-fs = "2"
rand = "0.8"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
local-ip-address = "0.6"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ed25519-dalek = { version = "2.1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Memory"] }
